<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQYwUSEVfdeHlb0d2EHTO6r4l3C70TBtQ",
  authDomain: "ananda-3fb23.firebaseapp.com",
  databaseURL: "https://ananda-3fb23-default-rtdb.firebaseio.com",
  projectId: "ananda-3fb23",
  storageBucket: "ananda-3fb23.firebasestorage.app",
  messagingSenderId: "1065653697435",
  appId: "1:1065653697435:web:00f7318bc94ae4d38bff3e"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

/*
  IMAGE PATH FIX

  Your real website images are stored in:
  /images/

  This automatically converts old Firebase paths such as:
  assets/cat-6.jpg
  assets/herbal-hero.jpg

  into:
  images/cat-6.jpg
  images/herbal-hero.jpg
*/
function resolveImage(path) {
  if (!path) {
    return "images/herbal-hero.jpg";
  }

  const value = String(path).trim();

  if (value.startsWith("assets/")) {
    return "images/" + value.substring(7);
  }

  if (value.startsWith("/assets/")) {
    return "/images/" + value.substring(8);
  }

  return value;
}

/*
  Make resolveImage available to the normal JavaScript
  section below this Firebase module.
*/
window.resolveImage = resolveImage;

window.anandaFirebase = {
  db,
  ref,
  onValue,
  resolveImage
};

window.anandaFirebaseReady =
  Promise.resolve(window.anandaFirebase);


/* APP SETTINGS */
onValue(ref(db, "/appSettings"), (snapshot) => {

  const data = snapshot.val() || {};

  console.log("ANANDA FIREBASE SETTINGS:", data);

  window.anandaFirebaseSettings = data;


  /* APP NAME */
  if (data.appName) {

    document.title = data.appName;

    const brandName =
      document.querySelector(".brand b");

    const heroName =
      document.querySelector(".hero h1");

    if (brandName) {
      brandName.textContent = data.appName;
    }

    if (heroName) {
      heroName.textContent = data.appName;
    }
  }


  /* LOGO */
  if (data.logoUrl) {

    const logo =
      document.getElementById("anandaLogo");

    if (logo) {
      logo.src = data.logoUrl;
    }
  }


  /* TAGLINE */
  if (data.appTagline) {

    const brandTagline =
      document.querySelector(".brand span");

    const heroTagline =
      document.querySelector(".hero h2");

    if (brandTagline) {
      brandTagline.textContent = data.appTagline;
    }

    if (heroTagline) {
      heroTagline.textContent = data.appTagline;
    }
  }


  /* HERO IMAGE */
  if (data.heroImage) {

    const heroImage =
      document.querySelector(".heroimg");

    if (heroImage) {

      heroImage.style.backgroundImage =
        "url('" +
        resolveImage(data.heroImage) +
        "')";

      heroImage.style.backgroundSize = "cover";

      heroImage.style.backgroundPosition =
        "center";
    }
  }

});
</script>
