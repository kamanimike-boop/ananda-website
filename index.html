<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2b1d">
<title>ANANDA | Ayurvedic Body & Mind Healing Consultancy</title>

<style>
:root{
  --forest:#123b2a;
  --deep:#0b2b1d;
  --gold:#c9a227;
  --cream:#f7f2e7;
  --white:#fff;
  --muted:#6b746d;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:#172019;
}

header{
  background:var(--deep);
  color:white;
  padding:18px 6%;
  position:sticky;
  top:0;
  z-index:10;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.logo{
  font-size:25px;
  font-weight:700;
  color:#e6c65c;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:15px;
}

.hero{
  padding:70px 6%;
  background:linear-gradient(135deg,#123b2a,#1e5a40);
  color:white;
}

.hero h1{
  font-size:clamp(38px,7vw,72px);
  margin:0 0 15px;
}

.hero p{
  max-width:700px;
  font-size:19px;
  line-height:1.6;
}

.btn{
  display:inline-block;
  border:0;
  border-radius:8px;
  padding:13px 20px;
  background:var(--gold);
  color:#111;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

section{
  padding:55px 6%;
  max-width:1200px;
  margin:auto;
}

h2{
  color:var(--forest);
  font-size:32px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:22px;
  box-shadow:0 5px 18px #0001;
}

.card h3{
  margin-top:0;
  color:var(--forest);
}

.price{
  font-size:22px;
  font-weight:700;
  margin:15px 0;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd2cc;
  border-radius:7px;
  margin:6px 0 12px;
  font:inherit;
}

textarea{
  min-height:90px;
}

.cart{
  background:white;
  padding:24px;
  border-radius:12px;
  box-shadow:0 5px 18px #0001;
}

#cartItems{
  margin:10px 0 20px;
}

.notice{
  padding:14px;
  border-radius:8px;
  background:#edf5ef;
  margin:12px 0;
  display:none;
}

footer{
  background:var(--deep);
  color:white;
  text-align:center;
  padding:30px;
}

small{
  color:var(--muted);
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">ANANDA</div>

<div>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#checkout">Checkout</a>
</div>

</nav>
</header>


<main>

<section class="hero" id="home">

<h1>Ayurvedic Body & Mind Healing</h1>

<p>
Natural herbal products and holistic wellness support from
ANANDA GreenHerbary.
</p>

<a class="btn" href="#products">
Explore Products
</a>

</section>


<section id="products">

<h2>Our Products</h2>

<div class="products" id="productGrid"></div>

</section>


<section id="checkout">

<h2>Checkout</h2>

<div class="cart">

<div id="cartItems">
Your cart is empty.
</div>

<div class="price">
Total: KSh <span id="cartTotal">0</span>
</div>


<form id="checkoutForm">

<input
id="name"
required
placeholder="Full name"
>

<input
id="phone"
required
placeholder="Phone e.g. 0712345678"
>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="address"
required
placeholder="Delivery address"
>

<input
id="city"
required
placeholder="City / Town"
>

<button
class="btn"
type="submit"
>
Pay with M-PESA
</button>

</form>


<div
id="notice"
class="notice"
></div>

</div>

</section>

</main>


<footer>
© 2026 ANANDA GreenHerbary
</footer>


<script>

const products = [

{
id:1,
name:"Herbal Wellness Blend",
price:800,
description:"A carefully prepared herbal wellness blend."
},

{
id:2,
name:"Ayurvedic Body Oil",
price:1200,
description:"Traditional herbal body oil for daily wellness."
},

{
id:3,
name:"Natural Herbal Tea",
price:600,
description:"A soothing herbal tea blend."
}

];


let cart =
JSON.parse(
localStorage.getItem("anandaCart") || "[]"
);


function saveCart(){

localStorage.setItem(
"anandaCart",
JSON.stringify(cart)
);

renderCart();

}


function addToCart(id){

const p =
products.find(
x => x.id === id
);

if(!p) return;

const item =
cart.find(
x => x.id === id
);

if(item){

item.qty++;

}else{

cart.push({
...p,
qty:1
});

}

saveCart();

document
.getElementById("checkout")
.scrollIntoView({
behavior:"smooth"
});

}


function removeFromCart(id){

cart =
cart.filter(
x => x.id !== id
);

saveCart();

}


function renderProducts(){

document
.getElementById("productGrid")
.innerHTML =

products.map(p => `

<div class="card">

<h3>
${p.name}
</h3>

<p>
${p.description}
</p>

<div class="price">
KSh ${p.price.toLocaleString()}
</div>

<button
class="btn"
onclick="addToCart(${p.id})"
>
Add to cart
</button>

</div>

`).join("");

}


function renderCart(){

const box =
document.getElementById("cartItems");

if(!cart.length){

box.innerHTML =
"Your cart is empty.";

document
.getElementById("cartTotal")
.textContent = "0";

return;

}


box.innerHTML =

cart.map(i => `

<div
style="
padding:8px 0;
border-bottom:1px solid #eee;
"
>

<strong>
${i.name}
</strong>

× ${i.qty}

—

KSh ${(i.price*i.qty).toLocaleString()}

<button
onclick="removeFromCart(${i.id})"
style="float:right"
>
Remove
</button>

</div>

`).join("");


const total =
cart.reduce(
(s,i) => s + i.price * i.qty,
0
);


document
.getElementById("cartTotal")
.textContent =
total.toLocaleString();

}


/*
========================================
M-PESA ORDER
========================================
*/

async function placeOrder(){

const name =
document
.getElementById("name")
.value
.trim();

const phone =
document
.getElementById("phone")
.value
.trim();

const email =
document
.getElementById("email")
.value
.trim();

const address =
document
.getElementById("address")
.value
.trim();

const city =
document
.getElementById("city")
.value
.trim();


const total =
cart.reduce(
(s,i) => s + i.price * i.qty,
0
);


if(!cart.length){

alert(
"Please add a product to your cart."
);

return;

}


/*
IMPORTANT:
Every payment gets a unique order ID.
*/

const orderId =
"ANANDA-" + Date.now();


const notice =
document.getElementById("notice");


notice.style.display =
"block";

notice.textContent =
"Sending M-PESA payment request...";


try{

const response =
await fetch(
"/api/mpesa/stkpush",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

name:name,

phone:phone,

email:email,

address:address,

city:city,

items:cart,

amount:total,

orderId:orderId,

accountReference:orderId,

transactionDesc:
"ANANDA Herbal Products"

})

});


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.error ||
"M-PESA request failed"
);

}


const checkoutRequestId =
data.checkoutRequestId;


notice.textContent =
"M-PESA prompt sent. Please complete payment on your phone.";


/*
Start checking payment status.
*/

pollPayment(
checkoutRequestId,
notice
);


}catch(error){

notice.textContent =
error.message;

alert(
error.message
);

}

}


/*
========================================
CHECK M-PESA PAYMENT STATUS
========================================
*/

async function pollPayment(
checkoutRequestId,
notice
){

let attempts = 0;


const timer =
setInterval(
async () => {

attempts++;


try{

const response =
await fetch(

"/api/mpesa/payment/" +
encodeURIComponent(
checkoutRequestId
)

);


if(!response.ok){

return;

}


const data =
await response.json();


/*
PAYMENT SUCCESS
*/

if(
data.status === "PAID"
){

clearInterval(timer);


notice.innerHTML =

"<strong>Payment successful.</strong>" +

" Receipt: " +

(
data.mpesaReceiptNumber ||
"confirmed"
);


/*
Clear cart after successful payment.
*/

cart = [];

saveCart();


document
.getElementById(
"checkoutForm"
)
.reset();

}


/*
PAYMENT FAILED
*/

else if(
data.status === "FAILED"
){

clearInterval(timer);


notice.textContent =

"Payment failed or was cancelled: " +

(
data.resultDesc ||
"Please try again."
);

}


/*
STOP polling after approximately
2 minutes.
*/

else if(
attempts >= 40
){

clearInterval(timer);


notice.textContent =

"Payment is still being processed. " +
"Please check your M-PESA messages.";

}

}catch(error){

console.log(
"Payment status check:",
error
);

}

},
3000
);

}


/*
========================================
CHECKOUT FORM
========================================
*/

document
.getElementById("checkoutForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

placeOrder();

}
);


/*
========================================
START WEBSITE
========================================
*/

renderProducts();

renderCart();

</script>

</body>
</html>
